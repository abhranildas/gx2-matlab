name: Sync getting-started docs from live script

# Whenever the exported Getting Started HTML changes on main, copy its
# current (already rendered) content into README.md and getting-started/*.png,
# and commit the result back to main. This does NOT run Matlab or execute
# anything -- it only reflects whatever state you last exported, so this step
# stays fast.
#
# Pushes made with the default GITHUB_TOKEN don't trigger new workflow runs,
# so the commit this job makes won't cause an infinite loop.
on:
  push:
    branches: [main]
    paths:
      - doc/html/GettingStarted.html

permissions:
  contents: write

jobs:
  regen-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install beautifulsoup4

      - name: Sync README and images from the getting-started guide
        run: python scripts/build_getting_started.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md getting-started/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: sync getting-started assets from live script"
            git push origin HEAD:main
          fi
